<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" width="220" height="48" role="img">
  <title>TrueFit</title>
  <desc>TrueFit — AI-powered CV generator logo</desc>

  <style>
    .doc-body  { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; }
    .doc-fold-bg { fill: #e2e8f0; }
    .doc-fold-shadow { fill: #cbd5e1; }
    .doc-line  { stroke: #dde3ec; }
    .doc-corner-fill { fill: #2563eb; }
    .doc-corner-glow { fill: #2563eb; opacity: 0.10; }
    .doc-corner-edge { stroke: #1d4ed8; }
    .word-true { fill: #0f172a; }
    .word-fit  { fill: #2563eb; }

    @media (prefers-color-scheme: dark) {
      .doc-body       { fill: #1e293b; stroke: #334155; stroke-width: 1.5; }
      .doc-fold-bg    { fill: #334155; }
      .doc-fold-shadow{ fill: #475569; }
      .doc-line       { stroke: #334155; }
      .word-true      { fill: #f8fafc; }
    }
  </style>

  <!-- Document body -->
  <rect x="0" y="2" width="36" height="44" rx="3" class="doc-body"/>

  <!-- Top-right fold -->
  <polygon points="24,2 36,2 36,14 24,14" class="doc-fold-bg"/>
  <polygon points="24,2 36,14 24,14" class="doc-fold-shadow"/>

  <!-- Document lines -->
  <line x1="6"  y1="22" x2="30" y2="22" class="doc-line" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="6"  y1="29" x2="30" y2="29" class="doc-line" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="6"  y1="36" x2="22" y2="36" class="doc-line" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Tucked bottom-right corner -->
  <polygon points="14,46 36,28 36,46" class="doc-corner-glow"/>
  <polygon points="14,46 36,46 25,35" class="doc-corner-fill"/>
  <line x1="14" y1="46" x2="25" y2="35" class="doc-corner-edge" stroke-width="0.8" stroke-linecap="round" fill="none"/>

  <!-- Wordmark — y adjusted to optically centre cap height with doc midpoint (doc spans y=2..46, mid=24) -->
  <text
    x="46"
    y="30"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="26"
    font-weight="500"
    letter-spacing="-0.4"
  >
    <tspan class="word-true">True</tspan><tspan class="word-fit">Fit</tspan>
  </text>
</svg>
