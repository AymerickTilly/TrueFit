<svg width="280" height="80" viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>TrueFit</title>
  <desc>TrueFit logo — document with fitted corner and wordmark</desc>

  <!-- Document body -->
  <rect x="0" y="4" width="56" height="68" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Top-right fold -->
  <polygon points="40,4 56,4 56,20 40,20" fill="#e2e8f0"/>
  <polygon points="40,4 56,20 40,20" fill="#cbd5e1"/>

  <!-- Document lines -->
  <line x1="9"  y1="30" x2="47" y2="30" stroke="#e2e8f0" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="9"  y1="39" x2="47" y2="39" stroke="#e2e8f0" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="9"  y1="48" x2="36" y2="48" stroke="#e2e8f0" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Tucked bottom-right corner -->
  <polygon points="30,72 56,50 56,72" fill="#2563eb" opacity="0.12"/>
  <polygon points="30,72 56,72 43,59" fill="#2563eb"/>
  <line x1="30" y1="72" x2="43" y2="59" stroke="#1d4ed8" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="500" y="52">
    <tspan x="72" fill="#0f172a">True</tspan><tspan fill="#2563eb">Fit</tspan>
  </text>

  <!-- Tagline -->
  <text x="73" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7.5" fill="#94a3b8" letter-spacing="2">HONEST · TAILORED · YOURS</text>
</svg>
