<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img">
  <title>TrueFit icon</title>
  <desc>TrueFit document icon with blue fitted corner</desc>

  <style>
    .doc-body        { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; }
    .doc-fold-bg     { fill: #e2e8f0; }
    .doc-fold-shadow { fill: #cbd5e1; }
    .doc-line        { stroke: #dde3ec; }
    .doc-corner-fill { fill: #2563eb; }
    .doc-corner-glow { fill: #2563eb; opacity: 0.10; }
    .doc-corner-edge { stroke: #1d4ed8; }

    @media (prefers-color-scheme: dark) {
      .doc-body        { fill: #1e293b; stroke: #334155; stroke-width: 1.5; }
      .doc-fold-bg     { fill: #334155; }
      .doc-fold-shadow { fill: #475569; }
      .doc-line        { stroke: #334155; }
    }
  </style>

  <!-- Document body -->
  <rect x="8" y="2" width="48" height="60" rx="4" class="doc-body"/>

  <!-- Top-right fold -->
  <polygon points="40,2 56,2 56,18 40,18" class="doc-fold-bg"/>
  <polygon points="40,2 56,18 40,18" class="doc-fold-shadow"/>

  <!-- Document lines -->
  <line x1="16" y1="28" x2="48" y2="28" class="doc-line" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="37" x2="48" y2="37" class="doc-line" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="46" x2="36" y2="46" class="doc-line" stroke-width="2" stroke-linecap="round"/>

  <!-- Tucked bottom-right corner -->
  <polygon points="28,62 56,40 56,62" class="doc-corner-glow"/>
  <polygon points="28,62 56,62 42,48" class="doc-corner-fill"/>
  <line x1="28" y1="62" x2="42" y2="48" class="doc-corner-edge" stroke-width="1" stroke-linecap="round" fill="none"/>
</svg>
