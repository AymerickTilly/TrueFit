<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img">
  <title>TrueFit</title>
  <desc>TrueFit favicon</desc>

  <style>
    .doc-body        { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.2; }
    .doc-fold-bg     { fill: #e2e8f0; }
    .doc-fold-shadow { fill: #cbd5e1; }
    .doc-line        { stroke: #dde3ec; }
    .doc-corner-fill { fill: #2563eb; }
    .doc-corner-glow { fill: #2563eb; opacity: 0.10; }
    .doc-corner-edge { stroke: #1d4ed8; }

    @media (prefers-color-scheme: dark) {
      .doc-body        { fill: #1e293b; stroke: #334155; stroke-width: 1.2; }
      .doc-fold-bg     { fill: #334155; }
      .doc-fold-shadow { fill: #475569; }
      .doc-line        { stroke: #334155; }
    }
  </style>

  <!-- Document body -->
  <rect x="4" y="1" width="24" height="30" rx="2.5" class="doc-body"/>

  <!-- Top-right fold -->
  <polygon points="20,1 28,1 28,9 20,9" class="doc-fold-bg"/>
  <polygon points="20,1 28,9 20,9" class="doc-fold-shadow"/>

  <!-- Document lines -->
  <line x1="8"  y1="14" x2="24" y2="14" class="doc-line" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="8"  y1="19" x2="24" y2="19" class="doc-line" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="8"  y1="24" x2="18" y2="24" class="doc-line" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Tucked bottom-right corner -->
  <polygon points="14,31 28,20 28,31" class="doc-corner-glow"/>
  <polygon points="14,31 28,31 21,24" class="doc-corner-fill"/>
  <line x1="14" y1="31" x2="21" y2="24" class="doc-corner-edge" stroke-width="0.7" stroke-linecap="round" fill="none"/>
</svg>
